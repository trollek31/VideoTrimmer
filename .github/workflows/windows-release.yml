name: Build Windows portable release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build portable package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build.ps1

      - name: Smoke-test runtime and app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$pwd\dist\VideoTrimmer_Windows"
          $runtimeZip = "$root\runtime\ffmpeg-runtime.zip"
          $check = "$env:RUNNER_TEMP\ffmpeg-check"
          Remove-Item $check -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $runtimeZip -DestinationPath $check -Force
          $ffmpeg = Get-ChildItem $check -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem $check -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          $ffplay = Get-ChildItem $check -Recurse -Filter 'ffplay.exe' | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe -or -not $ffplay) { throw 'Portable runtime is missing FFmpeg/FFprobe/FFplay.' }
          & $ffmpeg.FullName -hide_banner -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg failed to start.' }
          $test = "$env:RUNNER_TEMP\videotrimmer-test.mp4"
          $copy = "$env:RUNNER_TEMP\videotrimmer-copy.mp4"
          $exact = "$env:RUNNER_TEMP\videotrimmer-exact.mp4"
          & $ffmpeg.FullName -y -f lavfi -i "testsrc2=size=640x360:rate=30" -f lavfi -i "sine=frequency=1000:sample_rate=48000" -t 5 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -shortest $test
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate test MP4.' }
          & $ffmpeg.FullName -y -ss 1 -i $test -t 2 -c copy -avoid_negative_ts make_zero $copy
          if ($LASTEXITCODE -ne 0) { throw 'Stream-copy trim failed.' }
          & $ffmpeg.FullName -y -ss 1 -i $test -t 2 -c:v libx264 -preset veryfast -c:a aac $exact
          if ($LASTEXITCODE -ne 0) { throw 'Exact trim failed.' }
          $probe = & $ffprobe.FullName -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 $exact
          $duration = [double]::Parse($probe.Trim(), [Globalization.CultureInfo]::InvariantCulture)
          if ([math]::Abs($duration - 2.0) -gt 0.25) { throw "Exact trim duration check failed: $duration" }
          $p = Start-Process -FilePath "$root\VideoTrimmer.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($p.HasExited) { throw 'VideoTrimmer.exe exited immediately.' }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Smoke test passed.'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoTrimmer-Windows
          path: dist/VideoTrimmer_Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Video Trimmer v1.0.${{ github.run_number }}
          target_commitish: main
          files: dist/VideoTrimmer_Windows.zip
          generate_release_notes: true
